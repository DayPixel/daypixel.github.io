<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>친구의 겨울에 함께해요 · 아워시즌</title>
<meta name="description" content="친구들과 사진 한 장씩으로 함께 채우는 겨울 달력. 아워시즌에서 친구의 계절에 참여하세요.">
<meta property="og:title" content="친구의 겨울에 함께해요 · 아워시즌">
<meta property="og:description" content="사진 한 장씩, 우리끼리 채우는 겨울 달력">
<style>
@font-face{font-family:SUITE;src:url('/poff/assets/SUITE-Variable.woff2') format('woff2');font-display:swap;font-weight:300 900}
@font-face{font-family:Fraunces;src:url('./Fraunces.ttf') format('truetype');font-display:swap}
:root{--paper:#F3F8FD;--ink:#2C2C2A;--muted:#626B74;--blue:#0C447C;--line:#D9E5F1;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:SUITE,sans-serif;line-height:1.65}main{max-width:480px;margin:0 auto;padding:48px 28px 32px;min-height:100svh}header{font-family:Fraunces,serif;font-size:26px}h1{font-size:34px;line-height:1.35;letter-spacing:-1px;margin:46px 0 16px;font-weight:700}p{color:var(--muted);font-size:16px;margin:0 0 24px}.calendar{background:var(--white);padding:24px;border:1px solid var(--line);margin:28px 0 32px}.caption{font-size:12px;color:var(--muted);margin-bottom:8px}.month{font-size:28px;font-weight:700;line-height:1.3;margin-bottom:20px}.days,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.days span{font-size:10px;text-align:center;color:var(--muted);margin-bottom:5px}.grid span{aspect-ratio:1;background:#F4F3F0;border-radius:3px;padding:3px;font-size:9px;color:#626B74}.grid .filled{background:#B5D4F4;color:#0C447C}.grid .green{background:#A7B8A0;color:#263F25}.grid .brown{background:#CDB49A;color:#4D3521}.grid .blank{background:transparent}.action{display:flex;width:100%;min-height:54px;justify-content:center;align-items:center;border:0;border-radius:10px;background:var(--blue);color:var(--white);text-decoration:none;font:600 16px SUITE,sans-serif;cursor:pointer;padding:12px 16px}.action[aria-disabled=true]{background:#E1E6EA;color:#596671;pointer-events:none}.secondary{background:transparent;color:var(--blue);border:1px solid var(--line);margin-top:12px}.small{font-size:13px;margin-top:20px;line-height:1.6}.code{font-size:12px;overflow-wrap:anywhere;user-select:all;color:var(--muted);margin:12px 0 0}footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}a:focus-visible,button:focus-visible{outline:3px solid #378ADD;outline-offset:4px}[hidden]{display:none!important}@media(max-width:350px){main{padding:28px 20px}h1{font-size:29px;margin-top:32px}}
</style>
</head>
<body>
<main>
<header aria-label="아워시즌">our, season.</header>
<h1 id="title">친구가 기다리는 겨울에<br>함께할까요?</h1>
<p id="description">친구들과 사진 한 장씩으로<br>우리만의 겨울 달력을 채워요.</p>
<div class="calendar" aria-hidden="true">
<div class="caption">우리끼리 모으는 겨울</div><div class="month">11월</div>
<div class="days"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div class="grid"><span class="blank"></span><span class="blank"></span><span class="blank"></span><span class="blank"></span><span class="blank"></span><span>1</span><span>2</span><span class="filled">3</span><span>4</span><span class="green">5</span><span>6</span><span class="brown">7</span><span>8</span><span class="filled">9</span><span>10</span><span class="brown">11</span><span>12</span><span class="filled">13</span><span>14</span><span class="green">15</span><span>16</span><span>17</span><span class="filled">18</span><span class="green">19</span><span>20</span><span class="brown">21</span><span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span><span>30</span></div>
</div>
<a class="action" id="open" aria-disabled="true">아워시즌에서 참여하기</a>
<button class="action secondary" id="copy" hidden>초대 코드 복사하기</button>
<p class="code" id="code" hidden></p>
<p class="small" id="status" role="status">초대 링크를 확인하고 있어요.</p>
<footer>아워시즌은 현재 테스트 중이에요.<br>앱이 없다면 초대한 친구에게 설치 안내를 받아 주세요.<br>초대는 발급 후 7일 동안 유효하고 최대 6명이 함께해요.</footer>
</main>
<script>
(() => {
  const url = new URL(window.location.href);
  const code = url.searchParams.get('invite');
  window.history.replaceState(null, '', url.pathname);
  const open = document.getElementById('open');
  const copy = document.getElementById('copy');
  const status = document.getElementById('status');
  if (!code || !/^[a-f0-9]{32}$/i.test(code) || url.searchParams.getAll('invite').length !== 1) {
    document.getElementById('title').textContent = '친구와 함께 채우는 겨울';
    status.textContent = '초대 링크가 없거나 올바르지 않아요. 친구에게 새 링크를 받아 주세요.';
    return;
  }
  const value = code.toLowerCase();
  open.href = `ourseason://invite?invite=${value}`;
  open.removeAttribute('aria-disabled');
  copy.hidden = false;
  const text = document.getElementById('code'); text.textContent = value;
  status.textContent = '앱에서 온라인 연결 후 함께할 수 있어요. 카카오톡에서 앱이 열리지 않으면 링크를 Safari에서 열거나 초대 코드를 복사해 주세요.';
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(value); status.textContent = '초대 코드를 복사했어요. 앱의 초대 코드로 참여하기에 붙여 넣어 주세요.'; }
    catch { text.hidden = false; status.textContent = '아래 코드를 길게 눌러 복사해 주세요.'; }
  });
})();
</script>
</body>
</html>
